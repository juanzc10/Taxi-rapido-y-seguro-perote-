<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1C1C1E">
<meta name="robots" content="noindex">
<title>Central TaxiPerote</title>
<style>
:root{--bg:#1C1C1E;--card:#2C2C2E;--borde:#38383A;--txt:#fff;--txt2:#8E8E93;--verde:#34C759;--azul:#0A84FF;--rojo:#FF453A;--amar:#FFD60A}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--txt);padding:12px;max-width:900px;margin:0 auto}
[hidden]{display:none!important}
h1{font-size:1.3rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
button,input{font:inherit;color:inherit}
.btn{border:none;border-radius:10px;padding:10px 14px;background:#3A3A3C;cursor:pointer;min-height:42px}
.btn.p{background:var(--azul)}.btn.v{background:var(--verde);color:#000}.btn.r{background:#5a2623}
input{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;width:100%}
.login{max-width:340px;margin:60px auto;display:flex;flex-direction:column;gap:10px}
.aviso{background:#3A1E1C;color:#FFC9C5;border-radius:12px;padding:14px;margin:12px 0;line-height:1.4}
.res{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.res div{background:var(--card);border-radius:12px;padding:10px 14px;flex:1;min-width:120px}
.res small{color:var(--txt2);display:block}.res b{font-size:1.3rem}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tabs .btn.act{background:var(--azul)}
.pedido{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border-left:5px solid var(--amar)}
.pedido.asignado{border-color:var(--azul)}.pedido.encamino{border-color:#BF5AF2}.pedido.terminado{border-color:var(--verde)}.pedido.cancelado{border-color:var(--rojo);opacity:.7}
.pedido.nuevo{animation:pulso 1s 3}
@keyframes pulso{50%{background:#4a4420}}
.fila{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hora{color:var(--txt2);font-size:.85rem}.tarifa{color:var(--verde);font-weight:700;font-size:1.2rem}
.dato{margin-top:6px;line-height:1.35}.dato small{color:var(--txt2);display:block;font-size:.72rem}
.dato a{color:#8EC5FF}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acciones input{flex:1;min-width:140px}
.vacio{color:var(--txt2);text-align:center;padding:40px 0}
</style>
</head>
<body>
<section id="vistaConfig" class="aviso" hidden>
  Falta configurar Firebase. Pega los datos de tu proyecto en <b>firebase-config.js</b> (pasos en el README).
</section>

<section id="vistaLogin" class="login" hidden>
  <h1>🚖 Central TaxiPerote</h1>
  <input id="correo" type="email" placeholder="Correo" autocomplete="username">
  <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
  <button class="btn p" id="btnEntrar">Entrar</button>
  <p id="errLogin" style="color:#FFC9C5;font-size:.9rem"></p>
</section>

<section id="vistaPanel" hidden>
  <header><h1>🚖 Central TaxiPerote</h1><div><button class="btn" id="btnSonido">🔔 Sonido: sí</button> <button class="btn" id="btnSalir">Salir</button></div></header>
  <div class="res">
    <div><small>Pendientes</small><b id="rPend">0</b></div>
    <div><small>Terminados hoy</small><b id="rTerm">0</b></div>
    <div><small>Cobrado hoy</small><b id="rTotal">$0</b></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="lista"></div>
</section>

<script type="module">
import { fb } from './firebase-lib.js';
import { firebaseListo } from './firebase-config.js';
const $ = id => document.getElementById(id);
const ESTADOS = { pendiente: 'Pendiente', asignado: 'Asignado', encamino: 'En camino', terminado: 'Terminado', cancelado: 'Cancelado' };
const FILTROS = [['activos', 'Activos'], ['terminado', 'Terminados'], ['cancelado', 'Cancelados'], ['todos', 'Todos']];
let filtro = 'activos', pedidos = [], sonido = true, primera = true, conocidos = new Set(), f = null;

if (!firebaseListo()) { $('vistaConfig').hidden = false; }
else init();

async function init() {
  f = await fb();
  const { onAuthStateChanged, signInWithEmailAndPassword, signOut } = f.au;
  $('btnEntrar').onclick = async () => {
    $('errLogin').textContent = '';
    try { await signInWithEmailAndPassword(f.auth, $('correo').value.trim(), $('clave').value); }
    catch (e) { $('errLogin').textContent = 'Correo o contraseña incorrectos.'; }
  };
  $('clave').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnEntrar').click(); });
  $('btnSalir').onclick = () => signOut(f.auth);
  $('btnSonido').onclick = () => { sonido = !sonido; $('btnSonido').textContent = '🔔 Sonido: ' + (sonido ? 'sí' : 'no'); if (sonido) pitido(); };
  FILTROS.forEach(([k, t]) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = t; b.dataset.k = k; b.onclick = () => { filtro = k; pintar(); }; $('tabs').appendChild(b); });
  let baja = null;
  onAuthStateChanged(f.auth, u => {
    $('vistaLogin').hidden = !!u; $('vistaPanel').hidden = !u;
    if (baja) { baja(); baja = null; }
    if (u) baja = escuchar();
  });
}
function escuchar() {
  const { collection, query, orderBy, limit, onSnapshot } = f.fs;
  primera = true; conocidos = new Set();
  return onSnapshot(query(collection(f.db, 'pedidos'), orderBy('creado', 'desc'), limit(100)), snap => {
    let nuevo = false;
    pedidos = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    pedidos.forEach(p => { if (!conocidos.has(p.id)) { conocidos.add(p.id); if (!primera && p.estado === 'pendiente') { nuevo = true; p._nuevo = true; } } });
    primera = false; pintar();
    if (nuevo && sonido) pitido();
  }, err => { const l = $('lista'); l.innerHTML = ''; const d = document.createElement('div'); d.className = 'aviso'; d.textContent = 'No se pudo leer los pedidos: ' + err.message; l.appendChild(d); });
}
function pitido() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .2; o.start(); o.stop(a.currentTime + .4); } catch (e) {}
}
const hoy = d => d && d.toDate && d.toDate().toDateString() === new Date().toDateString();
const mapa = (la, lo) => `https://www.google.com/maps?q=${la},${lo}`;
function dato(padre, titulo, texto, lat, lon) {
  const d = document.createElement('div'); d.className = 'dato';
  const s = document.createElement('small'); s.textContent = titulo; d.appendChild(s);
  d.appendChild(document.createTextNode(texto || '—'));
  if (typeof lat === 'number' && typeof lon === 'number') { d.appendChild(document.createTextNode(' · ')); const a = document.createElement('a'); a.href = mapa(lat, lon); a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'ver mapa'; d.appendChild(a); }
  padre.appendChild(d);
}
async function cambiar(p, estado) {
  const { doc, updateDoc } = f.fs;
  try { await updateDoc(doc(f.db, 'pedidos', p.id), { estado }); } catch (e) { alert('No se pudo actualizar: ' + e.message); }
}
async function guardarTaxista(p, valor) {
  const { doc, updateDoc } = f.fs;
  try { await updateDoc(doc(f.db, 'pedidos', p.id), { taxista: valor.trim().slice(0, 60) }); } catch (e) {}
}
function pintar() {
  document.querySelectorAll('#tabs .btn').forEach(b => b.classList.toggle('act', b.dataset.k === filtro));
  $('rPend').textContent = pedidos.filter(p => p.estado === 'pendiente').length;
  const term = pedidos.filter(p => p.estado === 'terminado' && hoy(p.creado));
  $('rTerm').textContent = term.length;
  $('rTotal').textContent = '$' + term.reduce((s, p) => s + (Number(p.tarifa) || 0), 0);
  const lista = pedidos.filter(p => filtro === 'todos' || (filtro === 'activos' ? ['pendiente', 'asignado', 'encamino'].includes(p.estado) : p.estado === filtro));
  const cont = $('lista'); cont.innerHTML = '';
  if (!lista.length) { const v = document.createElement('div'); v.className = 'vacio'; v.textContent = 'Sin pedidos'; cont.appendChild(v); return; }
  lista.forEach(p => {
    const c = document.createElement('div'); c.className = 'pedido ' + p.estado + (p._nuevo ? ' nuevo' : '');
    const top = document.createElement('div'); top.className = 'fila';
    const h = document.createElement('span'); h.className = 'hora';
    h.textContent = (p.creado && p.creado.toDate ? p.creado.toDate().toLocaleString('es-MX', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' }) : 'ahora') + ' · ' + (ESTADOS[p.estado] || p.estado);
    const t = document.createElement('span'); t.className = 'tarifa'; t.textContent = p.tarifa ? '$' + p.tarifa : 'tarifa por confirmar';
    top.append(h, t); c.appendChild(top);
    if (p.nombre) dato(c, 'CLIENTE', p.nombre);
    dato(c, 'RECOGIDA', p.recogida, p.recogidaLat, p.recogidaLon);
    if (p.referencia) dato(c, 'REFERENCIA', p.referencia);
    dato(c, 'DESTINO', p.destino, p.destinoLat, p.destinoLon);
    const ac = document.createElement('div'); ac.className = 'acciones';
    const ti = document.createElement('input'); ti.placeholder = 'Taxista / unidad'; ti.value = p.taxista || ''; ti.maxLength = 60;
    ti.onchange = () => guardarTaxista(p, ti.value);
    ac.appendChild(ti);
    const btn = (txt, cls, est) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = txt; b.onclick = () => cambiar(p, est); ac.appendChild(b); };
    if (p.estado === 'pendiente') btn('Asignar', 'p', 'asignado');
    if (p.estado === 'asignado') btn('En camino', 'p', 'encamino');
    if (p.estado === 'encamino' || p.estado === 'asignado') btn('Terminar', 'v', 'terminado');
    if (['pendiente', 'asignado', 'encamino'].includes(p.estado)) btn('Cancelar', 'r', 'cancelado');
    c.appendChild(ac); cont.appendChild(c);
  });
}
</script>
</body>
</html>
