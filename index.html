<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1C1C1E">
    <title>TaxiPerote · Pide tu taxi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0B3D91;
            --whatsapp: #25D366;
            --whatsapp-dark: #1EBE57;
            --gps-btn: #0A84FF;
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --text: #FFFFFF;
            --text-secondary: #8E8E93;
            --border: #38383A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .floating-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 16px 32px 16px;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #FFF;
        }

        .btn-gps {
            background-color: rgba(10, 132, 255, 0.15);
            color: var(--gps-btn);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .route-box {
            background: #1C1C1E;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .route-input-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .route-icon {
            font-size: 1rem;
            width: 24px;
            text-align: center;
        }

        .route-input-group input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 1rem;
            color: var(--text);
            outline: none;
        }

        .route-input-group input::placeholder {
            color: var(--text-secondary);
        }

        .route-divider {
            height: 1px;
            background-color: var(--border);
            margin-left: 36px;
        }

        .fare-box {
            background: #1C1C1E;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .fare-box span {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .fare-box strong {
            font-size: 1.5rem;
            color: #34C759;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-dark);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="floating-panel">
        <div class="panel-header">
            <h1>🚖 TaxiPerote</h1>
            <button type="button" class="btn-gps" onclick="obtenerUbicacionGPS()">
                🛰️ Usar GPS
            </button>
        </div>

        <div class="route-box">
            <div class="route-input-group">
                <span class="route-icon">📍</span>
                <input type="text" id="origen" placeholder="¿Dónde estás? (Calle, número o referencias)" oninput="calcularTarifa()">
            </div>
            <div class="route-divider"></div>
            <div class="route-input-group">
                <span class="route-icon">🏁</span>
                <input type="text" id="destino" placeholder="¿A dónde vas? (Destino, colonia o comunidad)" oninput="calcularTarifa()">
            </div>
        </div>

        <div class="fare-box">
            <span>Tarifa Estimada</span>
            <strong id="precioDisplay">$40 MXN</strong>
        </div>

        <button type="button" class="btn-whatsapp" onclick="enviarWhatsApp()">
            💬 Pedir Taxi por WhatsApp
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {zoomControl: false}).setView([19.5694, -97.2472], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = L.marker([19.5694, -97.2472]).addTo(map)
            .bindPopup('<b>TaxiPerote Base</b>').openPopup();

        function obtenerUbicacionGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    map.setView([lat, lon], 16);
                    marker.setLatLng([lat, lon])
                          .bindPopup('<b>¡Ubicación GPS obtenida!</b>').openPopup();

                    document.getElementById('origen').value = `GPS Coordenadas: (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                    calcularTarifa();
                }, () => {
                    alert('No se pudo obtener la ubicación GPS. Escribe tu dirección manual.');
                }, { enableHighAccuracy: true });
            } else {
                alert('Tu dispositivo no soporta geolocalización.');
            }
        }

        function calcularTarifa() {
            const destinoTexto = document.getElementById('destino').value.trim().toLowerCase();
            let tarifa = 40; // Tarifa base urbana estándar en Perote

            // Motor inteligente de reconocimiento de destinos y comunidades
            if (destinoTexto.includes('totalco')) {
                tarifa = 150;
            } else if (destinoTexto.includes('sierra de agua') || destinoTexto.includes('sierra')) {
                tarifa = 90;
            } else if (destinoTexto.includes('tenextepec')) {
                tarifa = 80;
            } else if (destinoTexto.includes('los molinos') || destinoTexto.includes('molinos')) {
                tarifa = 100;
            } else if (destinoTexto.includes('hospital') || destinoTexto.includes('periferica') || destinoTexto.includes('clínica')) {
                tarifa = 50;
            } else {
                tarifa = 40;
            }

            document.getElementById('precioDisplay').innerText = `$${tarifa} MXN`;
            return tarifa;
        }

        function enviarWhatsApp() {
            const origen = document.getElementById('origen').value.trim() || "No especificado";
            const destino = document.getElementById('destino').value.trim() || "No especificado";
            const tarifa = calcularTarifa();

            // Guardar en memoria local para sincronizar con la central.html automáticamente
            const nuevoServicio = {
                origen: origen,
                destino: destino,
                tarifa: `$${tarifa} MXN`,
                tiempo: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            localStorage.setItem('taxiPeroteUltimoServicio', JSON.stringify(nuevoServicio));

            // Enviar a WhatsApp de la central
            const mensaje = `Hola Central TaxiPerote, necesito un servicio por favor:%0A📍 Recogida: ${origen}%0A🏁 Destino: ${destino}%0A💰 Tarifa Cotizada: $${tarifa} MXN`;
            const numeroWhatsApp = "522821073249";
            
            const url = `https://api.whatsapp.com/send?phone=${numeroWhatsApp}&text=${mensaje}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
