<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C1C1E">
<meta name="description" content="Taxi seguro en Perote: unidades monitoreadas por la central. Pide por WhatsApp con tarifa estimada al momento.">
<title>TaxiPerote · Taxi seguro en Perote</title>

<meta property="og:title" content="TaxiPerote · Taxi seguro en Perote">
<meta property="og:description" content="Taxi seguro: unidades monitoreadas por la central. Pide por WhatsApp con tarifa estimada.">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚖%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://unpkg.com" crossorigin>

<link rel="preconnect" href="https://photon.komoot.io" crossorigin>

<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root{--wa:#25D366;--wa-dark:#1EBE57;--azul:#0A84FF;--bg:#1C1C1E;--card:#1F1F21;--campo:#2C2C2E;--txt:#fff;--txt2:#8E8E93;--borde:#38383A;--sug:#2C2C2E;--verde:#34C759;--rojo:#FF453A;
  --hoja-h:260px;--pin-x:50%;--pin-y:40%;--arriba:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);overflow:hidden;position:fixed;inset:0}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
/* Mapa a pantalla completa detrás del panel (como Uber). */
.mapa{position:fixed;top:0;left:0;right:0;bottom:0;height:100vh;height:100dvh;z-index:1;background:#1C1C1E}
.leaflet-container{background:#1C1C1E}
/* Mapa oscuro: se invierten los colores de los mosaicos de OpenStreetMap en el navegador. */
.oscuro .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.6)}
.leaflet-control-attribution{font-size:9px;background:rgba(28,28,30,.7)!important;color:#C7C7CC!important;margin-top:calc(var(--arriba) + 4px)!important}
.leaflet-control-attribution a{color:#8EC5FF!important}

/* ---------- Botones flotantes ---------- */
.btn-redondo{position:fixed;z-index:1100;width:48px;height:48px;border-radius:50%;border:none;background:#2C2C2E;color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.55);cursor:pointer}
.btn-redondo:active{background:#3A3A3C}
.btn-redondo svg{width:24px;height:24px}
.atras{top:calc(var(--arriba) + 12px);left:14px}
.gps{right:14px;bottom:calc(var(--hoja-h) + 14px);color:var(--azul)}
.gps.buscando svg{animation:girar 1.2s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.marca{position:fixed;z-index:1100;top:calc(var(--arriba) + 12px);left:14px;background:rgba(28,28,30,.88);border-radius:22px;padding:10px 14px;font-weight:700;font-size:.95rem;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.msg{display:none;position:fixed;z-index:1200;top:calc(var(--arriba) + 70px);left:14px;right:14px;max-width:460px;margin:0 auto;font-size:.88rem;line-height:1.35;border-radius:14px;padding:12px 40px 12px 14px;
  background:#3A1E1C;color:#FFC9C5;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.msg.info{background:#16304F;color:#CFE6FF}
.msg button{position:absolute;top:4px;right:4px;width:36px;height:36px;border:none;background:none;font-size:1rem;color:inherit;cursor:pointer}

/* ---------- Pin fijo al centro (no es un marcador de Leaflet) ---------- */
.pin-centro{position:fixed;z-index:900;left:var(--pin-x);top:var(--pin-y);width:40px;height:56px;transform:translate(-50%,-100%);pointer-events:none;display:none}
.modo-pin .pin-centro{display:block}
.pin-cuerpo{position:absolute;left:0;right:0;top:0;bottom:0;transition:transform .18s ease}
.pin-cabeza{position:absolute;left:2px;top:0;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.pin-cabeza i{width:12px;height:12px;background:#111;display:block}
.pin-centro.origen .pin-cabeza i{border-radius:50%}
.pin-palo{position:absolute;left:18px;top:34px;width:4px;height:22px;background:#fff;border-radius:0 0 2px 2px}
.pin-sombra{position:absolute;left:15px;bottom:-3px;width:10px;height:5px;border-radius:50%;background:rgba(0,0,0,.55);transition:transform .18s ease,opacity .18s}
.pin-centro.levantado .pin-cuerpo{transform:translateY(-12px)}
.pin-centro.levantado .pin-sombra{transform:scale(1.6);opacity:.35}

/* ---------- Punto azul del GPS con cono de dirección ---------- */
.gps-dot{position:relative;width:60px;height:60px}
.gps-centro{position:absolute;left:21px;top:21px;width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
.gps-cono{position:absolute;left:0;top:0;width:60px;height:60px;display:none;
  background:conic-gradient(from -30deg,rgba(26,115,232,.55),rgba(26,115,232,0) 60deg,transparent 60deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 30px,transparent 30px);mask:radial-gradient(circle,#000 30px,transparent 30px)}
.marca-punto{width:20px;height:20px;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.6)}

/* ---------- Panel inferior ---------- */
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);border-radius:20px 20px 0 0;
  box-shadow:0 -6px 24px rgba(0,0,0,.55);max-height:calc(100vh - 90px);max-height:calc(100dvh - var(--arriba) - 80px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px}
@media (min-width:700px){.hoja{left:16px;right:auto;bottom:16px;width:420px;border-radius:20px}}
.asa{display:flex;justify-content:center;align-items:center;height:22px;cursor:pointer;touch-action:none;position:sticky;top:0;background:var(--card);z-index:3;margin:0 -16px;padding:0 16px}
.asa span{width:40px;height:5px;border-radius:3px;background:#5A5A5E}
.pie{position:sticky;bottom:0;background:var(--card);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:3}

/* Vista principal */
.ruta{background:var(--campo);border-radius:14px;overflow:hidden}
.fila{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 12px;border:none;background:none;text-align:left;cursor:pointer}
.fila+.fila{border-top:1px solid var(--borde)}
.fila:active{background:rgba(255,255,255,.06)}
.fila-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.fila-txt small{font-size:.7rem;color:var(--txt2);font-weight:600;letter-spacing:.02em}
.fila-txt b{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-txt b.vacio{color:var(--txt2);font-weight:500}
.ico-o{width:12px;height:12px;border-radius:50%;background:var(--verde);flex:0 0 auto;box-shadow:0 0 0 3px rgba(52,199,89,.25)}
.ico-d{width:12px;height:12px;background:#fff;flex:0 0 auto}
.fila .lupa{color:var(--txt2);display:flex}
.fila .lupa svg{width:20px;height:20px}
.seguro{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(52,199,89,.12);color:#9BE7AE;font-size:.82rem;line-height:1.25}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--campo);border:1px solid var(--borde);border-radius:20px;padding:0 14px;min-height:40px;font-size:.9rem;cursor:pointer}
.chip.activo{background:rgba(10,132,255,.2);border-color:var(--azul);color:#8EC5FF}
.resumen{font-size:.82rem;color:#C7C7CC;padding:8px 2px 0;display:none}
.extra{display:none;padding-top:6px}
.hoja.expandida .extra{display:block}
.hoja.expandida .chips{display:flex!important}
.hoja.expandida .resumen{display:none!important}
.tarifa{background:var(--campo);border-radius:14px;padding:12px 16px;margin-top:8px}
.tarifa-fila{display:flex;justify-content:space-between;align-items:baseline}
.tarifa-fila span{color:var(--txt2);font-weight:600;font-size:.95rem}
.tarifa-fila strong{font-size:1.6rem;color:var(--verde)}
.tarifa-fila strong.calc{color:#9BE7AE;opacity:.8}
.detalle{font-size:.85rem;color:#C7C7CC;margin-top:4px}
.nota{font-size:.72rem;color:var(--txt2);margin-top:4px}
.campo{display:flex;align-items:center;gap:10px;background:var(--campo);border:1px solid transparent;border-radius:12px;padding:0 12px;min-height:50px;margin-top:8px}
.campo:focus-within{border-color:var(--azul)}
.campo input{flex:1;min-width:0;border:none;background:transparent;color:var(--txt);font-size:1rem;outline:none;padding:13px 0}
.campo input::placeholder{color:var(--txt2)}
.btn-sec{width:100%;min-height:46px;margin-top:10px;border-radius:12px;border:1px solid var(--borde);background:none;color:#C7C7CC;font-size:.92rem;cursor:pointer}
.creditos{font-size:.7rem;color:var(--txt2);text-align:center;margin:10px 0 4px}
.btn-principal{width:100%;min-height:56px;border:none;border-radius:14px;font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  background:#E5E5EA;color:#111}
.btn-principal:active{background:#C7C7CC}
.btn-principal.wa{background:var(--wa);color:#fff;box-shadow:0 4px 15px rgba(37,211,102,.35)}
.btn-principal.wa:active{background:var(--wa-dark)}

/* Vista "Fija tu destino" */
.vista-pin h2{font-size:1.45rem;font-weight:800;margin:4px 0 2px}
.vista-pin .sub{font-size:.92rem;color:var(--txt2);margin-bottom:12px}
.vista-pin.escribiendo h2,.vista-pin.escribiendo .sub{display:none}
.campo-pin{display:flex;align-items:center;gap:12px;background:var(--campo);border-radius:12px;padding:0 4px 0 14px;min-height:54px;border:1px solid transparent}
.campo-pin:focus-within{border-color:var(--azul)}
.campo-pin .cuadro{width:12px;height:12px;background:#fff;flex:0 0 auto}
.vista-pin.origen .campo-pin .cuadro{border-radius:50%;background:var(--verde)}
.campo-pin input{flex:1;min-width:0;border:none;background:transparent;color:var(--txt);font-size:1.02rem;font-weight:500;outline:none;padding:15px 0;text-overflow:ellipsis}
.campo-pin input::placeholder{color:var(--txt2);font-weight:400}
.campo-pin button{width:46px;height:46px;border:none;background:none;color:#C7C7CC;display:flex;align-items:center;justify-content:center;cursor:pointer}
.campo-pin button svg{width:22px;height:22px}
.sugerencias{background:var(--sug);border-radius:12px;margin-top:6px;max-height:42vh;max-height:42dvh;overflow-y:auto;display:none}
.sug{padding:12px 14px;font-size:.95rem;border-bottom:1px solid var(--borde);cursor:pointer;min-height:48px}
.sug:last-child{border-bottom:none}
.sug small{display:block;color:var(--txt2);font-size:.75rem;margin-top:2px}
.sug:active,.sug:hover{background:rgba(255,255,255,.08)}
.sug-nota{padding:10px 14px;font-size:.8rem;color:var(--txt2)}
</style>
</head>
<body>
<div id="mapa" class="mapa"></div>

<!-- Pin fijo en el centro del mapa (modo "Fija tu destino") -->
<div class="pin-centro" id="pinCentro" aria-hidden="true">
  <div class="pin-sombra"></div>
  <div class="pin-cuerpo"><div class="pin-cabeza"><i></i></div><div class="pin-palo"></div></div>
</div>

<div class="marca" id="marca">🚖 TaxiPerote</div>
<button type="button" class="btn-redondo atras" id="btnAtras" aria-label="Regresar" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
</button>
<button type="button" class="btn-redondo gps" id="btnGps" aria-label="Usar mi ubicación (GPS)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>
<div class="msg" id="mensaje" role="status"><span id="mensajeTxt"></span><button type="button" id="cerrarMensaje" aria-label="Cerrar aviso">✕</button></div>

<div class="hoja" id="hoja">
  <div class="asa" id="asa" role="button" tabindex="0" aria-label="Mostrar u ocultar más opciones"><span></span></div>

  <!-- Vista principal: recogida, destino y botón -->
  <section id="vistaPrincipal">
    <div class="ruta">
      <button type="button" class="fila" id="filaOrigen">
        <span class="ico-o"></span>
        <span class="fila-txt"><small>RECOGIDA</small><b id="txtOrigen" class="vacio">Buscando tu ubicación…</b></span>
      </button>
      <button type="button" class="fila" id="filaDestino">
        <span class="ico-d"></span>
        <span class="fila-txt"><small>DESTINO</small><b id="txtDestino" class="vacio">¿A dónde vas?</b></span>
        <span class="lupa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
      </button>
    </div>
    <div class="seguro">🛡️ <span><b>Taxi seguro</b> · unidades monitoreadas por la central</span></div>
    <div class="chips" id="chips"></div>
    <div class="resumen" id="resumen"></div>

    <div class="extra" id="extra">
      <div class="tarifa">
        <div class="tarifa-fila"><span>Tarifa estimada</span><strong id="precio">—</strong></div>
        <div class="detalle" id="detalle">Elige tu destino para ver el precio.</div>
        <div class="nota">Precio aproximado por kilómetros y minutos. El conductor lo confirma por WhatsApp.</div>
      </div>
      <div class="campo"><span>🙋</span><input id="nombre" type="text" autocomplete="name" placeholder="Tu nombre (opcional)" maxlength="60"></div>
      <div class="campo"><span>🏠</span><input id="referencia" type="text" placeholder="Referencia: casa azul, frente a la tienda…" maxlength="120"></div>
      <button type="button" class="btn-sec" id="btnCompartir">📤 Compartir mi viaje con un familiar</button>
      <button type="button" class="btn-sec" id="btnSinDestino">💬 Pedir sin indicar destino</button>
      <p class="creditos">Mapa gratuito · OpenStreetMap</p>
    </div>
    <div class="pie"><button type="button" class="btn-principal" id="btnPedir">¿A dónde vas?</button></div>
  </section>

  <!-- Vista "Fija tu destino / punto de recogida" -->
  <section id="vistaPin" class="vista-pin" hidden>
    <h2 id="pinTitulo">Fija tu destino</h2>
    <p class="sub">Arrastra el mapa para mover el marcador</p>
    <div class="campo-pin">
      <span class="cuadro"></span>
      <input id="pinInput" type="text" autocomplete="off" enterkeyhint="search" placeholder="¿A dónde vas?" aria-label="Dirección">
      <button type="button" id="pinBuscar" aria-label="Buscar dirección"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    </div>
    <div class="sugerencias" id="sugPin"></div>
    <div class="pie"><button type="button" class="btn-principal" id="btnConfirmar">Confirmar destino</button></div>
  </section>
</div>

<script>
/* =====================================================================
   TaxiPerote — versión 100 % gratuita (sin Google, sin claves).
   Mapa: OpenStreetMap · Rutas: OSRM (FOSSGIS) · Búsqueda: Photon (komoot)
   ===================================================================== */

/* ---------------- CONFIGURACIÓN DE PRECIOS — Juan: cambia aquí (MXN) ---------------- */
const TARIFA = {
  // Cobro estilo Uber: tarifa base + km del viaje + minutos del viaje (recogida → destino).
  BANDERAZO: 20,          // Tarifa base por subir.
  PRECIO_KM: 7,           // Pesos por km del viaje.
  PRECIO_MIN: 1.5,        // Pesos por minuto del viaje.
  MINIMO: 40,             // Ningún viaje cuesta menos que esto.
  // Km "en vacío" (base → recogida y regreso a la base). Como Uber: no se cobran (0).
  KM_VACIO_GRATIS: 3,
  PRECIO_KM_VACIO: 0,
  RECARGO_NOCTURNO: 0.20, // 0.20 = 20 % más. Pon 0 para quitarlo.
  HORA_INICIO_NOCHE: 22,  // 22:00
  HORA_FIN_NOCHE: 6,      // hasta 06:00
  REDONDEO: 5,            // Redondear al múltiplo de $5 más cercano.
  FACTOR_SIN_RUTA: 1.3,   // Sin servicio de rutas: línea recta × 1.3
  FACTOR_INSTANTANEO: 1.15, // Precio "≈" que se muestra mientras llega la ruta real.
  VELOCIDAD_KMH: 35       // Para estimar minutos si no hay servicio de rutas.
};
// Tarifas fijas opcionales: cambia a true para usarlas en vez del cálculo por km.
const USAR_TARIFAS_FIJAS = false;
const TARIFAS_FIJAS = { "Totalco": 250, "Los Molinos": 180, "Sierra de Agua": 160, "Tenextepec": 140 };

const NUMERO_WHATSAPP = "522821073249";
const BASE = { lat: 19.5694, lon: -97.2472 };
const ZONA_BUSQUEDA = { oeste: -97.55, sur: 19.30, este: -96.95, norte: 19.80 };

/* ---------------- SERVICIOS GRATUITOS (se pueden cambiar aquí sin tocar lo demás) ---------------- */
const SERVICIOS = {
  MAPA: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  MAPA_OSCURO: true,  // true = mapa oscuro (colores invertidos en el navegador)
  RUTAS: ['https://routing.openstreetmap.de/routed-car/route/v1/driving/',   // FOSSGIS
          'https://router.project-osrm.org/route/v1/driving/'],             // respaldo
  PHOTON: 'https://photon.komoot.io',
  NOMINATIM: 'https://nominatim.openstreetmap.org'  // solo respaldo y solo al tocar "buscar"
};
/* ===================================================================== */

// Coordenadas fijas de los destinos frecuentes (botones instantáneos, sin consultar internet).
const LUGARES = [
  { chip: "🏛️ Centro",     nombre: "Centro de Perote, Plaza de Armas", lat: 19.56138, lon: -97.24250 },
  { chip: "🚌 Terminal",   nombre: "Terminal de Autobuses ADO Perote", lat: 19.56249, lon: -97.24348 },
  { chip: "🏥 Hospital",   nombre: "Hospital General Perote",          lat: 19.55973, lon: -97.24467 },
  { chip: "Totalco",        nombre: "Totalco",                           lat: 19.50194, lon: -97.34750 },
  { chip: "Los Molinos",    nombre: "Los Molinos",                       lat: 19.59472, lon: -97.21583 },
  { chip: "Sierra de Agua", nombre: "Sierra de Agua",                    lat: 19.60444, lon: -97.20083 },
  { chip: "Tenextepec",     nombre: "Tenextepec",                        lat: 19.48545, lon: -97.26569 },
  { chip: "🏰 Fortaleza",  nombre: "Fortaleza de San Carlos",          lat: 19.57357, lon: -97.24549 }
];

/* ---------------- Tarifa (funciones puras) ---------------- */
function esHorarioNocturno(f) {
  const h = f.getHours(), i = TARIFA.HORA_INICIO_NOCHE, n = TARIFA.HORA_FIN_NOCHE;
  return i > n ? (h >= i || h < n) : (h >= i && h < n);
}
function calcularTarifaKm(kmViaje, kmIda, kmRegreso, fecha, minViaje = 0) {
  kmViaje = Math.max(0, Number(kmViaje) || 0);
  minViaje = Math.max(0, Number(minViaje) || 0);
  const vacio = Math.max(0, (Number(kmIda) || 0) - TARIFA.KM_VACIO_GRATIS)
              + Math.max(0, (Number(kmRegreso) || 0) - TARIFA.KM_VACIO_GRATIS);
  let total = TARIFA.BANDERAZO + kmViaje * TARIFA.PRECIO_KM + minViaje * TARIFA.PRECIO_MIN + vacio * TARIFA.PRECIO_KM_VACIO;
  const nocturno = !!fecha && TARIFA.RECARGO_NOCTURNO > 0 && esHorarioNocturno(fecha);
  if (nocturno) total *= 1 + TARIFA.RECARGO_NOCTURNO;
  total = Math.round(Math.max(TARIFA.MINIMO, total) / TARIFA.REDONDEO) * TARIFA.REDONDEO;
  return { total, nocturno, kmVacio: vacio };
}
function distanciaRectaKm(a, b) {
  const R = 6371, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function estimacionRecta(o, d, f = TARIFA.FACTOR_SIN_RUTA) {
  const v = TARIFA.VELOCIDAD_KMH / 60;
  const kmViaje = distanciaRectaKm(o, d) * f, kmIda = distanciaRectaKm(BASE, o) * f;
  return { kmViaje, minViaje: kmViaje / v, kmIda, minIda: kmIda / v,
           kmRegreso: distanciaRectaKm(d, BASE) * f, path: null, aproximado: true };
}
</script>

<script>
/* ======================= Utilidades ======================= */
const $ = (id) => document.getElementById(id);
const esperar = (ms) => new Promise(r => setTimeout(r, ms));
async function fetchJSON(url, { ms = 7000, signal } = {}) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  const alAbortar = () => c.abort();
  if (signal) signal.addEventListener('abort', alAbortar);
  try {
    const r = await fetch(url, { signal: c.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); if (signal) signal.removeEventListener('abort', alAbortar); }
}
// Cola sencilla: como máximo 1 consulta por segundo a cada servicio (lo piden sus reglas de uso).
const ultimoUso = {};
async function turno(servicio, msMin = 1100) {
  const ahora = Date.now(), listo = Math.max(ahora, (ultimoUso[servicio] || 0) + msMin);
  ultimoUso[servicio] = listo;
  if (listo > ahora) await esperar(listo - ahora);
}
function cacheGuardar(mapa, k, v, max = 60) { mapa.set(k, v); if (mapa.size > max) mapa.delete(mapa.keys().next().value); }

/* ======================= Servicios gratuitos ======================= */
const cacheBusqueda = new Map(), cacheInverso = new Map(), cacheRutas = new Map();
const B = ZONA_BUSQUEDA;

function nombrePhoton(p) {
  const calle = [p.street, p.housenumber].filter(Boolean).join(' ');
  const principal = p.name || calle || p.district || p.city || 'Lugar';
  const detalle = [p.name && calle ? calle : '', p.district || p.locality, p.city || p.county, p.state].filter(Boolean)
    .filter((x, i, a) => a.indexOf(x) === i && x !== principal).join(', ');
  return { principal, detalle };
}

let buscarCtrl = null;
async function buscarPhoton(texto) {
  const k = 'p:' + texto.toLowerCase();
  if (cacheBusqueda.has(k)) return cacheBusqueda.get(k);
  if (buscarCtrl) buscarCtrl.abort();            // cancela la búsqueda anterior
  buscarCtrl = new AbortController();
  const url = `${SERVICIOS.PHOTON}/api/?q=${encodeURIComponent(texto)}&lat=${BASE.lat}&lon=${BASE.lon}`
    + `&limit=10&lang=default&zoom=12&location_bias_scale=0.1&bbox=${B.oeste},${B.sur},${B.este},${B.norte}`;
  const d = await fetchJSON(url, { ms: 5000, signal: buscarCtrl.signal });
  const vistos = new Set();
  const res = (d.features || []).map(f => {
    const n = nombrePhoton(f.properties || {});
    const r = { nombre: n.principal, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] };
    r.km = distanciaRectaKm(BASE, r);
    r.detalle = [n.detalle, `a ${r.km < 1 ? '<1' : Math.round(r.km)} km de la base`].filter(Boolean).join(' · ');
    return r;
  }).filter(r => { const k = r.nombre + '|' + r.detalle; if (vistos.has(k)) return false; vistos.add(k); return true; })
    .sort((x, y) => x.km - y.km).slice(0, 6);   // lo más cercano a Perote primero
  cacheGuardar(cacheBusqueda, k, res);
  return res;
}
// Respaldo: Nominatim NO permite autocompletar, así que solo se usa cuando el cliente toca "Buscar"/Enter.
async function buscarNominatim(texto) {
  const k = 'n:' + texto.toLowerCase();
  if (cacheBusqueda.has(k)) return cacheBusqueda.get(k);
  await turno('nominatim');
  const d = await fetchJSON(`${SERVICIOS.NOMINATIM}/search?format=jsonv2&limit=6&countrycodes=mx&bounded=1`
    + `&viewbox=${B.oeste},${B.norte},${B.este},${B.sur}&q=` + encodeURIComponent(texto));
  const res = d.map(x => ({ nombre: x.name || x.display_name.split(',')[0], detalle: x.display_name, lat: +x.lat, lon: +x.lon }));
  cacheGuardar(cacheBusqueda, k, res);
  return res;
}
async function nombreDeCoordenadas(p) {
  const k = p.lat.toFixed(4) + ',' + p.lon.toFixed(4);
  if (cacheInverso.has(k)) return cacheInverso.get(k);
  let nombre = null;
  try {
    const d = await fetchJSON(`${SERVICIOS.PHOTON}/reverse?lat=${p.lat}&lon=${p.lon}&lang=default&limit=1`, { ms: 5000 });
    const f = d.features && d.features[0];
    if (f) {
      const q = f.properties, calle = [q.street, q.housenumber].filter(Boolean).join(' ');
      nombre = [calle || q.name, q.district || q.locality || q.city].filter(Boolean).join(', ') || null;
    }
  } catch (e) {}
  if (!nombre) {
    try {
      await turno('nominatim');
      const d = await fetchJSON(`${SERVICIOS.NOMINATIM}/reverse?format=jsonv2&zoom=18&lat=${p.lat}&lon=${p.lon}`);
      const a = d.address || {};
      nombre = [[a.road, a.house_number].filter(Boolean).join(' '), a.neighbourhood || a.suburb || a.village || a.town || a.city]
        .filter(Boolean).join(', ') || d.display_name || null;
    } catch (e) {}
  }
  if (nombre) cacheGuardar(cacheInverso, k, nombre);
  return nombre;
}
// Una sola consulta por cotización: base → recogida → destino → base.
async function calcularRuta(o, d) {
  const pts = [BASE, o, d, BASE].map(p => `${p.lon.toFixed(6)},${p.lat.toFixed(6)}`).join(';');
  let ultimoError;
  for (const servidor of SERVICIOS.RUTAS) {
    try {
      await turno('rutas:' + servidor);
      const r = await fetchJSON(servidor + pts + '?overview=false&steps=true&geometries=geojson', { ms: 7000 });
      if (r.code !== 'Ok' || !r.routes || !r.routes.length) throw new Error('Sin ruta');
      const legs = r.routes[0].legs, path = [];
      legs[1].steps.forEach(s => s.geometry.coordinates.forEach(c => path.push({ lat: c[1], lon: c[0] })));
      return { kmViaje: legs[1].distance / 1000, minViaje: legs[1].duration / 60,
               kmIda: legs[0].distance / 1000, minIda: legs[0].duration / 60,
               kmRegreso: legs[2].distance / 1000, path, aproximado: false };
    } catch (e) { ultimoError = e; }
  }
  throw ultimoError;
}

/* ======================= Mapa (Leaflet) ======================= */
let mapa = null, linea = null;
const marcas = {};
const esCompu = () => window.matchMedia('(min-width: 700px)').matches;
function iniciarMapa() {
  if (typeof L === 'undefined') {
    $('mapa').innerHTML = '<p style="padding:90px 20px;color:#8E8E93">No se pudo cargar el mapa. Aún puedes pedir tu taxi por WhatsApp.</p>';
    return;
  }
  if (SERVICIOS.MAPA_OSCURO) $('mapa').classList.add('oscuro');
  mapa = L.map('mapa', { zoomControl: false, attributionControl: false }).setView([BASE.lat, BASE.lon], 14);
  // Créditos arriba para que el panel no los tape (lo piden las reglas de OpenStreetMap).
  L.control.attribution({ position: 'topright', prefix: false }).addTo(mapa);
  L.tileLayer(SERVICIOS.MAPA, {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · '
      + 'Rutas <a href="https://project-osrm.org" target="_blank" rel="noopener">OSRM</a> · '
      + 'Búsqueda <a href="https://photon.komoot.io" target="_blank" rel="noopener">Photon</a> · '
      + '<a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener">Corregir mapa</a>'
  }).addTo(mapa);
  L.circleMarker([BASE.lat, BASE.lon], { radius: 7, color: '#FFD60A', fillColor: '#FFD60A', fillOpacity: .9 }).addTo(mapa).bindPopup('<b>Base TaxiPerote</b>');
  mapa.on('click', e => alTocarMapa({ lat: e.latlng.lat, lon: e.latlng.lng }));
  mapa.on('movestart zoomstart', alEmpezarMover);
  mapa.on('moveend', alTerminarMover);
  refrescarMarcas();
  if (ultimoGPS) pintarPuntoAzul(ultimoGPS);
  const inicio = puntos.origen || ultimoGPS;
  if (inicio) centrar(inicio, 16);
}
function marcar(tipo, p) {
  if (!mapa) return;
  const m = marcas[tipo];
  if (!p) { if (m) { mapa.removeLayer(m); delete marcas[tipo]; } return; }
  if (m) { m.setLatLng([p.lat, p.lon]); return; }
  const estilo = tipo === 'origen' ? 'background:#34C759;border-radius:50%' : 'background:#111';
  const icon = L.divIcon({ className: '', html: `<div class="marca-punto" style="${estilo}"></div>`, iconSize: [20, 20], iconAnchor: [10, 10] });
  const mk = L.marker([p.lat, p.lon], { icon, keyboard: false }).addTo(mapa);
  mk.on('click', () => entrarPin(tipo));     // tocar un punto lo vuelve a editar
  marcas[tipo] = mk;
}
function refrescarMarcas() { ['origen', 'destino'].forEach(t => marcar(t, modoPin ? (modoPin === t ? null : puntos[t]) : puntos[t])); }
function dibujar(path, o, d) {
  if (!mapa) return;
  if (linea) { mapa.removeLayer(linea); linea = null; }
  if (!o || !d || modoPin) return;
  linea = path
    ? L.polyline(path.map(p => [p.lat, p.lon]), { color: '#0A84FF', weight: 5, opacity: .9 })
    : L.polyline([[o.lat, o.lon], [d.lat, d.lon]], { color: '#0A84FF', weight: 4, dashArray: '8 8' });
  linea.addTo(mapa);
  const pad = esCompu() ? { paddingTopLeft: [460, 70], paddingBottomRight: [40, 40] }
                        : { paddingTopLeft: [30, 80], paddingBottomRight: [30, $('hoja').offsetHeight + 30] };
  mapa.fitBounds(linea.getBounds(), { ...pad, maxZoom: 16 });
}
// Lugar de la pantalla donde queda la punta del pin: centro del mapa que se ve arriba del panel.
function posicionPin() {
  const W = window.innerWidth, H = window.innerHeight, h = $('hoja').offsetHeight;
  if (esCompu()) return { x: Math.round((W + 436) / 2), y: Math.round(H / 2 + 24) };
  return { x: Math.round(W / 2), y: Math.round(Math.max(110, (H - h) / 2 + 24)) };
}
let pinPos = { x: 0, y: 0 }, ajustandoPin = false;
function acomodarPin() {
  const h = $('hoja').offsetHeight;
  document.documentElement.style.setProperty('--hoja-h', (esCompu() ? 0 : h) + 'px');
  if (modoPin && document.activeElement === $('pinInput')) return;   // con el teclado abierto no se mueve
  const antes = pinPos;
  pinPos = posicionPin();
  document.documentElement.style.setProperty('--pin-x', pinPos.x + 'px');
  document.documentElement.style.setProperty('--pin-y', pinPos.y + 'px');
  // Si el panel cambió de tamaño en modo pin, mueve el mapa junto con el pin para no cambiar el punto elegido.
  if (modoPin && mapa && (antes.x !== pinPos.x || antes.y !== pinPos.y) && antes.y) {
    ajustandoPin = true;
    mapa.panBy([antes.x - pinPos.x, antes.y - pinPos.y], { animate: false });
    ajustandoPin = false;
  }
}
// Centra el mapa para que el punto quede justo bajo el pin (o arriba del panel).
function centrar(p, z) {
  if (!mapa) return;
  const s = mapa.getSize(), pos = posicionPin();
  const previo = ajustandoPin;
  ajustandoPin = true;    // los dos movimientos cuentan como uno solo
  mapa.setView([p.lat, p.lon], z || mapa.getZoom(), { animate: false });
  mapa.panBy([s.x / 2 - pos.x, s.y / 2 - pos.y], { animate: false });
  ajustandoPin = previo;
  if (!previo) alTerminarMover();
}
function puntoBajoPin() {
  const ll = mapa.containerPointToLatLng(L.point(pinPos.x, pinPos.y));
  return { lat: ll.lat, lon: ll.lng };
}

/* ======================= Estado ======================= */
const puntos = { origen: null, destino: null };
let cotizacion = null, folio = 0, modoPin = null, ultimoGPS = null, estadoGPS = 'buscando';

function mostrarMensaje(t, tipo) {
  const el = $('mensaje'); if (!t) { el.style.display = 'none'; return; }
  $('mensajeTxt').textContent = t; el.className = 'msg' + (tipo === 'info' ? ' info' : ''); el.style.display = 'block';
}
function coordTxt(p) { return `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`; }
function pintarFilas() {
  const o = puntos.origen, d = puntos.destino, to = $('txtOrigen'), td = $('txtDestino');
  to.textContent = o ? o.nombre : estadoGPS === 'buscando' ? 'Buscando tu ubicación…' : '¿Dónde te recogemos? Toca aquí';
  to.classList.toggle('vacio', !o);
  td.textContent = d ? d.nombre : '¿A dónde vas?';
  td.classList.toggle('vacio', !d);
  document.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('activo', !!d && d.nombre === ch.dataset.nombre));
  $('chips').style.display = d ? 'none' : 'flex';      // con destino elegido, el panel queda más chico
  pintarBoton();
}
function pintarBoton() {
  const b = $('btnPedir');
  b.classList.remove('wa');
  if (!puntos.origen) b.textContent = 'Fijar punto de recogida';
  else if (!puntos.destino) b.textContent = 'Elegir destino';
  else {
    b.classList.add('wa');
    b.textContent = cotizacion ? `💬 Pedir taxi · ${cotizacion.aproximado && $('precio').classList.contains('calc') ? '≈ ' : ''}$${cotizacion.total}` : '💬 Pedir taxi';
  }
}
function fijarPunto(tipo, p) {
  puntos[tipo] = p;
  refrescarMarcas(); pintarFilas();
  recalcular();
}
async function ponerNombre(tipo, p, sufijo = '') {
  const n = await nombreDeCoordenadas(p);
  if (n && puntos[tipo] && puntos[tipo].lat === p.lat && puntos[tipo].lon === p.lon) {
    puntos[tipo].nombre = n + sufijo; pintarFilas();
  }
}
function alTocarMapa(p) {
  if (modoPin) { centrar(p); return; }                 // en modo pin, tocar el mapa mueve el marcador ahí
  entrarPin(!puntos.origen ? 'origen' : 'destino', p);
}

/* ======================= Modo pin: "Fija tu destino" ======================= */
const TEXTOS_PIN = {
  origen:  { titulo: 'Fija tu punto de recogida', boton: 'Confirmar recogida', placeholder: '¿Dónde te recogemos?' },
  destino: { titulo: 'Fija tu destino',            boton: 'Confirmar destino',  placeholder: '¿A dónde vas?' }
};
let pinNombre = null, pinElegido = null, pinTimer = null, pinFolio = 0, pinEsDireccion = false;
function entrarPin(tipo, enPunto) {
  modoPin = tipo;
  const t = TEXTOS_PIN[tipo];
  document.body.classList.add('modo-pin');
  $('hoja').classList.remove('expandida');
  $('vistaPrincipal').hidden = true; $('vistaPin').hidden = false;
  $('vistaPin').classList.toggle('origen', tipo === 'origen');
  $('pinCentro').classList.toggle('origen', tipo === 'origen');
  $('pinTitulo').textContent = t.titulo; $('btnConfirmar').textContent = t.boton;
  $('pinInput').placeholder = t.placeholder; $('pinInput').value = '';
  $('sugPin').style.display = 'none';
  $('btnAtras').hidden = false; $('marca').hidden = true;
  mostrarMensaje('');
  refrescarMarcas(); dibujar(null);
  acomodarPin();
  // Dónde arranca el pin: el punto actual, o tu ubicación GPS, o tu recogida, o la base.
  const inicio = enPunto || puntos[tipo] || (tipo === 'origen' ? ultimoGPS : (ultimoGPS || puntos.origen)) || puntos.origen || BASE;
  pinElegido = puntos[tipo] && !enPunto ? { ...puntos[tipo] } : null;
  if (mapa) centrar(inicio, Math.max(mapa.getZoom(), tipo === 'origen' ? 17 : 16));
  else { pinNombre = puntos[tipo] ? puntos[tipo].nombre : null; $('pinInput').value = pinNombre || ''; }
}
function salirPin() {
  if (!modoPin) return;
  clearTimeout(pinTimer); pinFolio++;
  modoPin = null;
  document.body.classList.remove('modo-pin');
  $('pinInput').blur();
  $('vistaPin').hidden = true; $('vistaPin').classList.remove('escribiendo'); $('vistaPrincipal').hidden = false;
  $('btnAtras').hidden = true; $('marca').hidden = false;
  $('pinCentro').classList.remove('levantado');
  refrescarMarcas(); pintarFilas();
  requestAnimationFrame(() => { acomodarPin(); recalcular(); if (!(puntos.origen && puntos.destino) && (puntos.origen || puntos.destino)) centrar(puntos.destino || puntos.origen); });
}
function alEmpezarMover() {
  if (!modoPin || ajustandoPin) return;
  clearTimeout(pinTimer); pinFolio++;
  $('pinCentro').classList.add('levantado');
  const input = $('pinInput');
  if (document.activeElement !== input) { input.value = ''; input.placeholder = 'Buscando dirección…'; pinEsDireccion = false; }
}
function alTerminarMover() {
  if (!modoPin || !mapa || ajustandoPin) return;
  $('pinCentro').classList.remove('levantado');
  clearTimeout(pinTimer);
  const c = puntoBajoPin(), n = ++pinFolio, input = $('pinInput');
  // Si el punto viene de una búsqueda o de un botón, ya sabemos su nombre.
  if (pinElegido && distanciaRectaKm(c, pinElegido) < 0.015) { ponerTextoPin(pinElegido.nombre); return; }
  pinElegido = null; pinNombre = null;
  if (document.activeElement !== input) { input.value = ''; input.placeholder = 'Buscando dirección…'; }
  // Espera ~600 ms a que el cliente deje de mover el mapa (y la cola respeta 1 consulta/seg en Nominatim).
  pinTimer = setTimeout(async () => {
    const nombre = await nombreDeCoordenadas(c);
    if (n !== pinFolio || !modoPin) return;
    ponerTextoPin(nombre || `Punto en el mapa (${coordTxt(c)})`);
  }, 600);
}
function ponerTextoPin(nombre) {
  pinNombre = nombre;
  const input = $('pinInput');
  input.placeholder = TEXTOS_PIN[modoPin].placeholder;
  if (document.activeElement !== input) { input.value = nombre; pinEsDireccion = true; }
}
function confirmarPin() {
  if (!modoPin) return;
  const tipo = modoPin, c = mapa ? puntoBajoPin() : (puntos[tipo] || pinElegido);
  if (!c) { mostrarMensaje('No se pudo leer el mapa. Escribe la dirección.'); return; }
  const cercaGPS = tipo === 'origen' && ultimoGPS && distanciaRectaKm(c, ultimoGPS) < 0.03;
  let nombre = pinNombre;
  const pendiente = !nombre;
  if (!nombre) nombre = `${tipo === 'origen' ? 'Punto de recogida' : 'Destino'} (${coordTxt(c)})`;
  const p = { lat: c.lat, lon: c.lon, nombre: nombre + (cercaGPS && !/\(GPS\)$/.test(nombre) ? ' (GPS)' : ''), gps: !!cercaGPS };
  if (pinElegido && distanciaRectaKm(c, pinElegido) < 0.015) { p.lat = pinElegido.lat; p.lon = pinElegido.lon; }
  salirPin();
  fijarPunto(tipo, p);
  if (pendiente) ponerNombre(tipo, p, cercaGPS ? ' (GPS)' : '');
  // Flujo como Uber: confirmada la recogida, sigue el destino.
  if (tipo === 'origen' && !puntos.destino) setTimeout(() => entrarPin('destino'), 50);
}

/* ---------- Búsqueda escrita dentro del modo pin (Photon mientras escribe) ---------- */
let tempBusqueda = null;
function sinAcentos(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function configurarBusquedaPin() {
  const input = $('pinInput'), cont = $('sugPin'), vista = $('vistaPin');
  const elegir = item => {
    clearTimeout(tempBusqueda); cont.style.display = 'none';
    pinElegido = { lat: item.lat, lon: item.lon, nombre: item.nombre };
    input.value = item.nombre; pinEsDireccion = true; pinNombre = item.nombre;
    vista.classList.remove('escribiendo');
    input.blur();
    setTimeout(() => { acomodarPin(); centrar(pinElegido, Math.max(mapa ? mapa.getZoom() : 16, 16)); if (!mapa) ponerTextoPin(item.nombre); }, 60);
  };
  const buscarYa = async () => {
    const val = input.value.trim(); if (val.length < 3) { input.focus(); return; }
    const s = cont.querySelector('.sug'); if (s && cont.style.display === 'block') { s.click(); return; }
    pintar(cont, [], 'Buscando…', elegir);
    try {   // búsqueda explícita: Photon y, si no hay nada, Nominatim
      let r = []; try { r = await buscarPhoton(val); } catch (err) {}
      if (!r.length) r = await buscarNominatim(val);
      if (input.value.trim() !== val) return;
      pintar(cont, r, r.length ? '' : 'Sin resultados. Prueba otra calle o mueve el mapa.', elegir);
    } catch (err) { pintar(cont, [], 'No se pudo buscar (¿sin señal?). Mueve el mapa para marcar el punto.', elegir); }
  };
  input.addEventListener('focus', () => {
    vista.classList.add('escribiendo');
    input.placeholder = 'Escribe calle, colonia o lugar';
    if (pinEsDireccion) { input.value = ''; pinEsDireccion = false; }   // campo limpio para escribir; al salir vuelve la dirección
    if (cont.querySelector('.sug')) cont.style.display = 'block';
  });
  input.addEventListener('blur', () => setTimeout(() => {
    if (document.activeElement === input) return;
    cont.style.display = 'none'; vista.classList.remove('escribiendo');
    if (!modoPin) return;
    input.placeholder = pinNombre ? TEXTOS_PIN[modoPin].placeholder : 'Buscando dirección…';
    input.value = pinNombre || ''; pinEsDireccion = !!pinNombre;     // si no eligió nada, vuelve la dirección del pin
    acomodarPin();
  }, 200));
  input.addEventListener('input', () => {
    pinEsDireccion = false;
    const val = input.value.trim(); clearTimeout(tempBusqueda);
    if (!val) { cont.style.display = 'none'; return; }
    const locales = LUGARES.filter(l => sinAcentos(l.nombre).includes(sinAcentos(val)));
    pintar(cont, locales, val.length >= 3 ? 'Buscando…' : '', elegir);
    if (val.length < 3) return;
    tempBusqueda = setTimeout(async () => {
      try {
        const r = await buscarPhoton(val);
        if (input.value.trim() !== val) return;
        pintar(cont, locales.concat(r), r.length || locales.length ? '' : 'Sin resultados. Toca 🔍 para buscar más, o mueve el mapa.', elegir);
      } catch (e) {
        if (e.name === 'AbortError' || input.value.trim() !== val) return;
        pintar(cont, locales, 'La búsqueda rápida no respondió. Toca 🔍 para buscar, o mueve el mapa.', elegir);
      }
    }, 300);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); buscarYa(); } if (e.key === 'Escape') input.blur(); });
  $('pinBuscar').addEventListener('mousedown', e => e.preventDefault());
  $('pinBuscar').addEventListener('click', () => {
    if (document.activeElement !== input || pinEsDireccion) { input.focus(); return; }
    buscarYa();
  });
}
function pintar(cont, lista, nota, alElegir) {
  cont.innerHTML = '';
  lista.forEach(item => {
    const div = document.createElement('div'); div.className = 'sug'; div.textContent = item.nombre;
    if (item.detalle) { const s = document.createElement('small'); s.textContent = item.detalle; div.appendChild(s); }
    div.addEventListener('mousedown', e => e.preventDefault());
    div.addEventListener('click', () => alElegir(item));
    cont.appendChild(div);
  });
  if (nota) { const n = document.createElement('div'); n.className = 'sug-nota'; n.textContent = nota; cont.appendChild(n); }
  cont.style.display = cont.childElementCount ? 'block' : 'none';
}

/* ---------------- GPS ---------------- */
function avisoPermisoGPS() {
  const ua = navigator.userAgent || '';
  if (/FBAN|FBAV|Instagram|WhatsApp|Line\//i.test(ua))
    return 'Estás en el navegador de WhatsApp/Facebook. Toca ⋮ o ••• y elige "Abrir en Chrome" o "Abrir en Safari" para usar el GPS. O mueve el mapa hasta donde te recogemos.';
  if (/iPhone|iPad/i.test(ua))
    return 'El GPS está bloqueado. En tu iPhone ve a Ajustes › Privacidad › Localización (actívala) y en Safari permite la ubicación para este sitio. O mueve el mapa hasta donde te recogemos.';
  return 'El GPS está bloqueado. Toca el candado 🔒 junto a la dirección de la página › Permisos › Ubicación › Permitir, y vuelve a tocar el botón de ubicación. O mueve el mapa hasta donde te recogemos.';
}
let puntoAzul = null, circuloPrecision = null, rumbo = null, vigilando = false;
function pintarPuntoAzul(pos) {
  ultimoGPS = { lat: pos.lat, lon: pos.lon, precision: pos.precision };
  if (!mapa) return;
  const ll = [pos.lat, pos.lon];
  if (!puntoAzul) {
    const icon = L.divIcon({ className: '', html: '<div class="gps-dot"><div class="gps-cono"></div><div class="gps-centro"></div></div>', iconSize: [60, 60], iconAnchor: [30, 30] });
    puntoAzul = L.marker(ll, { icon, interactive: false, keyboard: false, zIndexOffset: -100 }).addTo(mapa);
    circuloPrecision = L.circle(ll, { radius: pos.precision || 30, color: '#1A73E8', weight: 1, opacity: .4, fillOpacity: .1, interactive: false }).addTo(mapa);
  } else { puntoAzul.setLatLng(ll); circuloPrecision.setLatLng(ll).setRadius(pos.precision || 30); }
  actualizarCono();
}
function actualizarCono() {
  const el = puntoAzul && puntoAzul.getElement && puntoAzul.getElement();
  const cono = el && el.querySelector('.gps-cono'); if (!cono) return;
  if (rumbo == null) { cono.style.display = 'none'; return; }
  cono.style.display = 'block'; cono.style.transform = `rotate(${Math.round(rumbo)}deg)`;
}
// Brújula del celular para el cono de dirección (opcional: si no hay, solo se ve el punto azul).
let brujulaLista = false;
function escucharBrujula() {
  if (brujulaLista) return; brujulaLista = true;
  const h = e => {
    let d = null;
    if (typeof e.webkitCompassHeading === 'number') d = e.webkitCompassHeading;            // iPhone
    else if (e.absolute && typeof e.alpha === 'number') d = (360 - e.alpha) % 360;         // Android
    if (d != null) { rumbo = d; actualizarCono(); }
  };
  if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', h);
  else window.addEventListener('deviceorientation', h);
}
function permisoBrujula() {   // iPhone pide permiso para la brújula; solo se puede pedir al tocar un botón
  try {
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
      DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') escucharBrujula(); }).catch(() => {});
    else escucharBrujula();
  } catch (e) {}
}
function vigilarGPS() {   // mantiene el punto azul al día (no cambia la recogida ya fijada)
  if (vigilando || !navigator.geolocation) return; vigilando = true;
  navigator.geolocation.watchPosition(pos => {
    const c = pos.coords;
    if (typeof c.heading === 'number' && !isNaN(c.heading) && c.speed > 1) rumbo = c.heading;
    pintarPuntoAzul({ lat: c.latitude, lon: c.longitude, precision: c.accuracy });
  }, () => {}, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
}
function pedirGPS(automatico, precisionAlta = true) {
  const btn = $('btnGps');
  if (!navigator.geolocation || !window.isSecureContext) {
    estadoGPS = 'falló'; pintarFilas();
    if (!automatico) mostrarMensaje('Este navegador no permite usar el GPS aquí. Mueve el mapa o escribe tu dirección.');
    return;
  }
  btn.disabled = true; btn.classList.add('buscando');
  if (!puntos.origen) { estadoGPS = 'buscando'; pintarFilas(); }
  if (!automatico) mostrarMensaje('Buscando tu ubicación… si el celular pregunta, toca "Permitir".', 'info');
  navigator.geolocation.getCurrentPosition(pos => {
    btn.disabled = false; btn.classList.remove('buscando');
    estadoGPS = 'ok';
    const p = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    pintarPuntoAzul({ ...p, precision: pos.coords.accuracy });
    vigilarGPS();
    mostrarMensaje('');
    if (modoPin) { centrar(p, Math.max(mapa ? mapa.getZoom() : 17, 17)); return; }   // en modo pin: lleva el marcador a tu ubicación
    if (automatico && puntos.origen && !puntos.origen.gps) { pintarFilas(); return; } // ya marcó otra recogida a mano
    fijarPunto('origen', { ...p, nombre: `Mi ubicación (${coordTxt(p)})`, gps: true });
    if (!puntos.destino) centrar(p, 16);
    ponerNombre('origen', p, ' (GPS)');
  }, err => {
    // Si la señal precisa no llega (bajo techo), reintenta con la ubicación aproximada por red.
    if (precisionAlta && err.code !== 1) { pedirGPS(automatico, false); return; }
    btn.disabled = false; btn.classList.remove('buscando');
    estadoGPS = 'falló'; pintarFilas();
    const m = { 1: avisoPermisoGPS(),
                2: 'No se encontró tu ubicación. Revisa que la ubicación del celular esté encendida, o mueve el mapa hasta donde te recogemos.',
                3: 'El GPS tardó demasiado. Toca el botón de ubicación otra vez o mueve el mapa hasta donde te recogemos.' };
    mostrarMensaje(m[err.code] || m[2]);
  }, precisionAlta ? { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
                   : { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 });
}

/* ---------------- Cotización ---------------- */
function tarifaFija() {
  if (!USAR_TARIFAS_FIJAS) return null;
  const t = ((puntos.origen?.nombre || '') + ' ' + (puntos.destino?.nombre || '')).toLowerCase();
  for (const [lugar, precio] of Object.entries(TARIFAS_FIJAS)) if (t.includes(lugar.toLowerCase())) return { lugar, precio };
  return null;
}
function mostrarCotizacion(r, calculando) {
  const t = calcularTarifaKm(r.kmViaje, r.kmIda, r.kmRegreso, new Date(), r.minViaje);
  const fija = tarifaFija(), total = fija ? fija.precio : t.total;
  const el = $('precio'); el.textContent = `${calculando ? '≈ ' : ''}$${total} MXN`; el.classList.toggle('calc', !!calculando);
  const partes = [`${r.kmViaje.toFixed(1)} km`, `~${Math.max(1, Math.round(r.minViaje))} min de viaje`,
                  `el taxi llega en ~${Math.max(3, Math.round(r.minIda) + 2)} min`];
  const extra = [];
  if (fija) extra.push(`tarifa fija ${fija.lugar}`);
  else { if (t.kmVacio > 0 && TARIFA.PRECIO_KM_VACIO > 0) extra.push(`incluye ${t.kmVacio.toFixed(1)} km de traslado fuera de la ciudad`);
         if (t.nocturno) extra.push(`incluye ${Math.round(TARIFA.RECARGO_NOCTURNO * 100)} % nocturno`); }
  if (calculando) extra.push('calculando ruta…'); else if (r.aproximado) extra.push('distancia aproximada');
  $('detalle').textContent = partes.join(' · ') + (extra.length ? ' — ' + extra.join(' · ') : '');
  $('resumen').textContent = `${calculando ? '≈ ' : ''}$${total} MXN · ` + partes.join(' · ') + (t.nocturno && !fija ? ' · nocturna' : '');
  $('resumen').style.display = 'block';
  cotizacion = { total, kmViaje: r.kmViaje, minViaje: r.minViaje, nocturno: t.nocturno && !fija, aproximado: r.aproximado || calculando };
  pintarBoton();
}
async function recalcular() {
  const n = ++folio, o = puntos.origen, d = puntos.destino;
  cotizacion = null;
  dibujar(null, null, null);
  if (!o || !d) {
    $('precio').textContent = '—'; $('precio').classList.remove('calc');
    $('detalle').textContent = !d ? 'Elige tu destino para ver el precio.' : 'Falta dónde te recogemos.';
    $('resumen').style.display = 'none'; pintarBoton();
    return;
  }
  const clave = [o.lat, o.lon, d.lat, d.lon].map(x => x.toFixed(5)).join(',');
  let r = cacheRutas.get(clave);
  if (!r) {
    mostrarCotizacion(estimacionRecta(o, d, TARIFA.FACTOR_INSTANTANEO), true);   // precio al instante
    await esperar(150);                       // si el cliente sigue moviendo cosas, no consultamos de más
    if (n !== folio) return;
    try { r = await calcularRuta(o, d); cacheGuardar(cacheRutas, clave, r); }
    catch (e) { r = estimacionRecta(o, d); }
    if (n !== folio) return;
  }
  mostrarCotizacion(r, false);
  dibujar(r.path, o, d);
}

/* ---------------- WhatsApp ---------------- */
const linkMapa = p => `https://www.google.com/maps?q=${p.lat.toFixed(6)},${p.lon.toFixed(6)}`;  // solo un enlace, no usa Google en la página
function pedir() {
  const o = puntos.origen, d = puntos.destino;
  if (!o) { mostrarMensaje('Primero marca dónde te recogemos.', 'info'); entrarPin('origen'); return; }
  const nombre = $('nombre').value.trim(), ref = $('referencia').value.trim();
  try { localStorage.setItem('taxiPeroteDatos', JSON.stringify({ nombre, ref })); } catch (e) {}
  const lineas = ['Hola Central TaxiPerote, necesito un taxi por favor:', '🛡️ Servicio de taxi seguro (unidades monitoreadas)'];
  if (nombre) lineas.push(`🙋 Nombre: ${nombre}`);
  lineas.push(`📍 Recogida: ${o.nombre}`);
  lineas.push(`   Mapa: ${linkMapa(o)}`);
  if (ref) lineas.push(`🏠 Referencia: ${ref}`);
  lineas.push(`🏁 Destino: ${d ? d.nombre : 'Lo indico al subir'}`);
  if (d) lineas.push(`   Mapa: ${linkMapa(d)}`);
  if (cotizacion && d) {
    const c = cotizacion;
    lineas.push(`💰 Tarifa estimada: $${c.total} MXN (${c.kmViaje.toFixed(1)} km, ~${Math.max(1, Math.round(c.minViaje))} min${c.nocturno ? ', nocturna' : ''}${c.aproximado ? ', aprox.' : ''})`);
  } else lineas.push('💰 Tarifa: por confirmar');
  const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(lineas.join('\n'))}`;
  // Registra el pedido en la central (si Firebase está configurado); nunca retrasa más de 2 s.
  const datos = { recogida: o.nombre, recogidaLat: o.lat, recogidaLon: o.lon, destino: d ? d.nombre : 'Lo indica al subir' };
  if (nombre) datos.nombre = nombre; if (ref) datos.referencia = ref;
  if (d) { datos.destinoLat = d.lat; datos.destinoLon = d.lon; }
  if (cotizacion && d) datos.tarifa = cotizacion.total;
  const registro = window.registrarPedido ? window.registrarPedido(datos).catch(() => {}) : Promise.resolve();
  Promise.race([registro, esperar(2000)]).then(() => { location.href = url; });
}
// Compartir el viaje: abre WhatsApp para elegir a quién enviarlo (familiar o amigo).
function compartirViaje() {
  const o = puntos.origen, d = puntos.destino;
  if (!o) { mostrarMensaje('Primero marca dónde te recogemos.', 'info'); return; }
  const nombre = $('nombre').value.trim();
  const l = [`🚖 ${nombre ? nombre + ' va' : 'Voy'} en un TaxiPerote (taxi seguro, monitoreado por la central).`,
             `📍 Recogida: ${o.nombre}`, `   ${linkMapa(o)}`,
             `🏁 Destino: ${d ? d.nombre : 'por indicar'}`];
  if (d) l.push(`   ${linkMapa(d)}`);
  l.push(`🕒 ${new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })}`);
  window.open(`https://wa.me/?text=${encodeURIComponent(l.join('\n'))}`, '_blank', 'noopener');
}
function accionPrincipal() {
  if (!puntos.origen) entrarPin('origen');
  else if (!puntos.destino) entrarPin('destino');
  else pedir();
}

/* ---------------- Panel: tocar o arrastrar la barrita para ver más ---------------- */
function configurarAsa() {
  const hoja = $('hoja'), asa = $('asa');
  const alternar = abrir => {
    if (modoPin) return;
    hoja.classList.toggle('expandida', abrir === undefined ? !hoja.classList.contains('expandida') : abrir);
    if (!hoja.classList.contains('expandida')) hoja.scrollTop = 0;
  };
  let y0 = null, movido = false;
  asa.addEventListener('click', () => { if (!movido) alternar(); movido = false; });
  asa.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar(); } });
  asa.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; movido = false; }, { passive: true });
  asa.addEventListener('touchmove', e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0;
    if (Math.abs(dy) > 30) { movido = true; alternar(dy < 0); y0 = null; }
  }, { passive: true });
  asa.addEventListener('touchend', () => { y0 = null; setTimeout(() => { movido = false; }, 350); });
}

/* ---------------- Arranque ---------------- */
function iniciar() {
  const chips = $('chips');
  LUGARES.forEach(l => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = l.chip; b.dataset.nombre = l.nombre;
    b.addEventListener('click', () => fijarPunto('destino', { lat: l.lat, lon: l.lon, nombre: l.nombre }));
    chips.appendChild(b);
  });
  configurarBusquedaPin();
  configurarAsa();
  $('filaOrigen').addEventListener('click', () => entrarPin('origen'));
  $('filaDestino').addEventListener('click', () => entrarPin('destino'));
  $('btnPedir').addEventListener('click', accionPrincipal);
  $('btnSinDestino').addEventListener('click', pedir);
  $('btnCompartir').addEventListener('click', compartirViaje);
  $('btnConfirmar').addEventListener('click', confirmarPin);
  $('btnAtras').addEventListener('click', salirPin);
  $('cerrarMensaje').addEventListener('click', () => mostrarMensaje(''));
  $('btnGps').addEventListener('click', () => { permisoBrujula(); pedirGPS(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modoPin && document.activeElement !== $('pinInput')) salirPin(); });
  try { const g = JSON.parse(localStorage.getItem('taxiPeroteDatos') || '{}');
        if (g.nombre) $('nombre').value = g.nombre; if (g.ref) $('referencia').value = g.ref; } catch (e) {}
  pintarFilas();
  iniciarMapa();
  if (window.ResizeObserver) new ResizeObserver(acomodarPin).observe($('hoja'));
  window.addEventListener('resize', acomodarPin);
  acomodarPin();
  if (!(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')) escucharBrujula();
  pedirGPS(true);
  window.addEventListener('offline', () => mostrarMensaje('Sin internet. Puedes pedir por WhatsApp cuando vuelva la señal.'));
  window.addEventListener('online', () => { mostrarMensaje(''); recalcular(); });
}
// DOMContentLoaded llega después de cargar Leaflet (script "defer").
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
</script>
