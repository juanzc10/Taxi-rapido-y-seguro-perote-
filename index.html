<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1C1C1E">
    <title>TaxiPerote · Pide tu taxi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0B3D91;
            --whatsapp: #25D366;
            --whatsapp-dark: #1EBE57;
            --gps-btn: #0A84FF;
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --text: #FFFFFF;
            --text-secondary: #8E8E93;
            --border: #38383A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .floating-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 16px 32px 16px;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #FFF;
        }

        .btn-gps {
            background-color: rgba(10, 132, 255, 0.15);
            color: var(--gps-btn);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: #1C1C1E;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #FFF;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--gps-btn);
        }

        .fare-box {
            background: #1C1C1E;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
        }

        .fare-box span {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .fare-box strong {
            font-size: 1.5rem;
            color: #34C759;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-dark);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="floating-panel">
        <div class="panel-header">
            <h1>🚖 TaxiPerote</h1>
            <button type="button" class="btn-gps" onclick="obtenerUbicacionGPS()">
                🛰️ Usar mi GPS
            </button>
        </div>

        <div class="form-group">
            <label>📍 Dirección o Referencia de Recogida</label>
            <input type="text" id="origen" placeholder="Ej: Calle, número o lugar de espera...">
        </div>

        <div class="form-group">
            <label>🏁 Ruta o Destino del Viaje</label>
            <select id="destinoSelect" onchange="calcularTarifa()">
                <optgroup label="Servicios Locales en Perote">
                    <option value="Perote Urbano / Centro ($40)">Perote Urbano / Centro ($40 MXN)</option>
                    <option value="Hospital o Zona Periférica ($50)">Hospital / Zona Periférica ($50 MXN)</option>
                </optgroup>
                <optgroup label="Salida desde Perote hacia Comunidades">
                    <option value="Perote ➔ Tenextepec ($80)">Perote ➔ Tenextepec ($80 MXN)</option>
                    <option value="Perote ➔ Sierra de Agua ($90)">Perote ➔ Sierra de Agua ($90 MXN)</option>
                    <option value="Perote ➔ Los Molinos ($100)">Perote ➔ Los Molinos ($100 MXN)</option>
                    <option value="Perote ➔ Totalco ($150)">Perote ➔ Totalco ($150 MXN)</option>
                </optgroup>
                <optgroup label="Servicio Especial (Desde Comunidad a Perote - Incluye traslado de base)">
                    <option value="Totalco a Perote - Taxi desde Base ($250)">Totalco ➔ Perote (Taxi va por ti) ($250 MXN)</option>
                    <option value="Los Molinos a Perote - Taxi desde Base ($180)">Los Molinos ➔ Perote (Taxi va por ti) ($180 MXN)</option>
                    <option value="Sierra de Agua a Perote - Taxi desde Base ($160)">Sierra de Agua ➔ Perote (Taxi va por ti) ($160 MXN)</option>
                    <option value="Tenextepec a Perote - Taxi desde Base ($140)">Tenextepec ➔ Perote (Taxi va por ti) ($140 MXN)</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label>🏠 Referencias adicionales (Opcional)</label>
            <input type="text" id="referenciaDestino" placeholder="Ej: Cerca de la iglesia, número de casa...">
        </div>

        <div class="fare-box">
            <span>Tarifa Estimada</span>
            <strong id="precioDisplay">$40 MXN</strong>
        </div>

        <button type="button" class="btn-whatsapp" onclick="enviarWhatsApp()">
            💬 Pedir Taxi por WhatsApp
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {zoomControl: false}).setView([19.5694, -97.2472], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = L.marker([19.5694, -97.2472]).addTo(map)
            .bindPopup('<b>TaxiPerote Base</b>').openPopup();

        function obtenerUbicacionGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    map.setView([lat, lon], 16);
                    marker.setLatLng([lat, lon])
                          .bindPopup('<b>¡Ubicación GPS obtenida!</b>').openPopup();

                    document.getElementById('origen').value = `GPS Coordenadas: (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                }, () => {
                    alert('No se pudo obtener la ubicación GPS. Escribe tu dirección manual.');
                }, { enableHighAccuracy: true });
            } else {
                alert('Tu dispositivo no soporta geolocalización.');
            }
        }

        function calcularTarifa() {
            const destino = document.getElementById('destinoSelect').value;
            let tarifa = 40;

            if (destino.includes('($250)')) tarifa = 250;
            else if (destino.includes('($180)')) tarifa = 180;
            else if (destino.includes('($160)')) tarifa = 160;
            else if (destino.includes('($140)')) tarifa = 140;
            else if (destino.includes('($150)')) tarifa = 150;
            else if (destino.includes('($100)')) tarifa = 100;
            else if (destino.includes('($90)')) tarifa = 90;
            else if (destino.includes('($80)')) tarifa = 80;
            else if (destino.includes('($50)')) tarifa = 50;
            else tarifa = 40;

            document.getElementById('precioDisplay').innerText = `$${tarifa} MXN`;
            return tarifa;
        }

        function enviarWhatsApp() {
            const origen = document.getElementById('origen').value.trim() || "No especificado (Usar GPS del cliente)";
            const destinoSelectText = document.getElementById('destinoSelect').value;
            const refDestino = document.getElementById('referenciaDestino').value.trim();
            const tarifa = calcularTarifa();

            let destinoFinal = destinoSelectText;
            if (refDestino !== "") {
                destinoFinal += ` (${refDestino})`;
            }

            // Sincronización automática con la central
            const nuevoServicio = {
                origen: origen,
                destino: destinoFinal,
                tarifa: `$${tarifa} MXN`,
                tiempo: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            localStorage.setItem('taxiPeroteUltimoServicio', JSON.stringify(nuevoServicio));

            // Mensaje para WhatsApp de la central
            const mensaje = `Hola Central TaxiPerote, necesito un servicio por favor:%0A📍 Recogida: ${origen}%0A🏁 Ruta/Destino: ${destinoFinal}%0A💰 Tarifa Cotizada: $${tarifa} MXN`;
            const numeroWhatsApp = "522821073249";
            
            const url = `https://api.whatsapp.com/send?phone=${numeroWhatsApp}&text=${mensaje}`;
            window.open(url, '_blank');
        }

        calcularTarifa();
    </script>
</body>
</html>
